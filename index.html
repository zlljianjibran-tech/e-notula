<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notula Rapat KUA - Kemenag Kab. Pasangkayu</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Inter & Font Awesome -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- SheetJS untuk Ekspor Excel -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <!-- html2pdf untuk Ekspor PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <!-- pdf-lib untuk menggabungkan lampiran PDF ke dalam hasil ekspor PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
    
    <style>
        body { font-family: 'Inter', sans-serif; }
        /* Styling khusus dokumen cetak / PDF */
        .kop-surat {
            font-family: 'Times New Roman', Times, serif;
            color: #000;
        }
        .doc-body {
            font-family: 'Times New Roman', Times, serif;
            color: #000;
            line-height: 1.4;
        }
        .doc-table th, .doc-table td {
            border: 1px solid #000;
            padding: 6px 8px;
            vertical-align: top;
        }
        .doc-table th {
            background-color: #f3f4f6;
            font-weight: bold;
            text-align: center;
        }
        /* Hilangkan scrollbar horizontal */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col">

    <!-- Navbar / Header Aplikasi -->
    <header class="bg-emerald-800 text-white shadow-md sticky top-0 z-30">
        <div class="max-w-7xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-3">
            <div class="flex items-center space-x-3">
                <div class="bg-white p-1.5 rounded-lg shadow-sm">
                    <i class="fas fa-file-signature text-emerald-700 text-xl"></i>
                </div>
                <div>
                    <h1 class="font-bold text-base sm:text-lg leading-tight">E-Notula Rapat KUA</h1>
                    <p class="text-xs text-emerald-200">Seksi Bimas Islam - Kemenag Kab. Pasangkayu</p>
                </div>
            </div>
            
            <div class="flex flex-wrap items-center gap-2">
                <button type="button" onclick="createNewNotula()" class="bg-emerald-700 hover:bg-emerald-600 text-white px-3 py-2 rounded-lg text-xs sm:text-sm font-medium transition flex items-center gap-1.5 border border-emerald-600">
                    <i class="fas fa-plus"></i> <span class="hidden sm:inline">Notula Baru</span>
                </button>
                <button type="button" onclick="openSavedModal()" class="bg-amber-500 hover:bg-amber-600 text-slate-900 px-3 py-2 rounded-lg text-xs sm:text-sm font-semibold transition flex items-center gap-1.5 shadow-sm">
                    <i class="fas fa-folder-open"></i> <span>Arsip Tersimpan</span>
                    <span id="savedCountBadge" class="bg-slate-900 text-white text-xs px-1.5 py-0.5 rounded-full">0</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Notifikasi Toast -->
    <div id="toast" class="fixed bottom-5 right-5 z-50 transform translate-y-20 opacity-0 transition-all duration-300 bg-slate-800 text-white px-4 py-3 rounded-xl shadow-lg flex items-center gap-3 text-sm pointer-events-none">
        <i id="toastIcon" class="fas fa-check-circle text-emerald-400 text-lg"></i>
        <span id="toastMsg">Pesan notifikasi</span>
    </div>

    <!-- Main Container -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-4 grid grid-cols-1 lg:grid-cols-12 gap-6">
        
        <!-- Kolom Kiri: Form Input (5 Kolom di Desktop) -->
        <div class="lg:col-span-5 space-y-5">
            
            <!-- Card 1: Informasi Rapat -->
            <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-4 sm:p-5">
                <div class="flex items-center justify-between border-b border-slate-100 pb-3 mb-4">
                    <h2 class="font-bold text-slate-800 flex items-center gap-2">
                        <i class="fas fa-info-circle text-emerald-600"></i> Informasi Rapat
                    </h2>
                    <span id="statusEditBadge" class="text-xs bg-emerald-100 text-emerald-800 px-2.5 py-1 rounded-full font-medium">Draf Baru</span>
                </div>

                <div class="space-y-3 text-sm">
                    <div>
                        <label class="block font-medium text-slate-700 mb-1">Hari / Tanggal</label>
                        <input type="text" id="inHariTanggal" oninput="updatePreview()" placeholder="Contoh: Jumat, 13 November 2026" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none">
                    </div>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                        <div>
                            <label class="block font-medium text-slate-700 mb-1">Waktu</label>
                            <input type="text" id="inWaktu" oninput="updatePreview()" placeholder="09.00 WITA - Selesai" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none">
                        </div>
                        <div>
                            <label class="block font-medium text-slate-700 mb-1">Tempat</label>
                            <input type="text" id="inTempat" oninput="updatePreview()" placeholder="Aula Kemenag Pasangkayu" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none">
                        </div>
                    </div>
                    <div>
                        <label class="block font-medium text-slate-700 mb-1">Agenda Rapat</label>
                        <textarea id="inAgenda" rows="2" oninput="updatePreview()" placeholder="Evaluasi Layanan Nikah/Rujuk & Pelaporan BOP KUA..." class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none"></textarea>
                    </div>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                        <div>
                            <label class="block font-medium text-slate-700 mb-1">Pimpinan Rapat</label>
                            <input type="text" id="inPimpinan" oninput="updatePreview()" placeholder="Nama & Jabatan" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none">
                        </div>
                        <div>
                            <label class="block font-medium text-slate-700 mb-1">Notulis</label>
                            <input type="text" id="inNotulis" oninput="updatePreview()" placeholder="Nama & Jabatan" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none">
                        </div>
                    </div>
                    <div>
                        <label class="block font-medium text-slate-700 mb-1">Peserta Rapat</label>
                        <textarea id="inPeserta" rows="2" oninput="updatePreview()" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none">Kepala Seksi Bimas Islam, Para Kepala KUA Kecamatan se-Kabupaten Pasangkayu, Penghulu, Penyuluh Agama Islam, dan Staf Seksi Bimas Islam (Daftar hadir terlampir)</textarea>
                    </div>
                </div>
            </div>

            <!-- Card 2: Jalannya Rapat & Pembahasan -->
            <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-4 sm:p-5">
                <h2 class="font-bold text-slate-800 flex items-center gap-2 border-b border-slate-100 pb-3 mb-4">
                    <i class="fas fa-comments text-emerald-600"></i> Tambah Poin Pembahasan
                </h2>

                <div class="space-y-3 text-sm bg-slate-50 p-3.5 rounded-xl border border-slate-200">
                    <input type="hidden" id="editItemIndex" value="-1">
                    <div>
                        <label class="block font-medium text-slate-700 mb-1">Nama Pemberi Pernyataan</label>
                        <input type="text" id="inPemberiNama" placeholder="Contoh: H. Ahmad Fauzi, S.Ag." class="w-full px-3 py-2 bg-white border border-slate-300 rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none">
                        <!-- Rekomendasi 4 isian terakhir Nama -->
                        <div id="recentNamaContainer" class="flex flex-wrap gap-1.5 mt-1.5"></div>
                    </div>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                        <div>
                            <label class="block font-medium text-slate-700 mb-1">Jabatan / Unsur</label>
                            <input type="text" id="inPemberiJabatan" placeholder="Contoh: Kepala KUA Kec. Pasangkayu" class="w-full px-3 py-2 bg-white border border-slate-300 rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none">
                            <!-- Rekomendasi 4 isian terakhir Jabatan -->
                            <div id="recentJabatanContainer" class="flex flex-wrap gap-1.5 mt-1.5"></div>
                        </div>
                        <div>
                            <label class="block font-medium text-slate-700 mb-1">Jenis Pernyataan</label>
                            <select id="inJenisPernyataan" class="w-full px-3 py-2 bg-white border border-slate-300 rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none font-medium">
                                <option value="Penyampaian">Penyampaian</option>
                                <option value="Umpan Balik">Umpan Balik</option>
                                <option value="Keputusan">Keputusan</option>
                            </select>
                        </div>
                    </div>
                    <div>
                        <label class="block font-medium text-slate-700 mb-1">Pokok Pembahasan / Isi Pernyataan</label>
                        <textarea id="inIsiPernyataan" rows="3"
